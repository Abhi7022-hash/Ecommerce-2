version: "3.9"

services:

  mongodb:
    image: mongo:7
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - ecommerce-net

  user-service:
    build: ./user-service
    container_name: user-service
    ports:
      - "5001:5001"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/
      - SECRET_KEY=ecommerce-super-secret
    depends_on:
      - mongodb
    networks:
      - ecommerce-net
    restart: unless-stopped

  product-service:
    build: ./product-service
    container_name: product-service
    ports:
      - "5002:5002"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/
    depends_on:
      - mongodb
    networks:
      - ecommerce-net
    restart: unless-stopped

  order-service:
    build: ./order-service
    container_name: order-service
    ports:
      - "5003:5003"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/
      - USER_SERVICE_URL=http://user-service:5001
      - PRODUCT_SERVICE_URL=http://product-service:5002
    depends_on:
      - mongodb
      - user-service
      - product-service
    networks:
      - ecommerce-net
    restart: unless-stopped

  frontend-service:
    build: ./frontend-service
    container_name: frontend-service
    ports:
      - "5000:5000"
    environment:
      - USER_SERVICE_URL=http://localhost:5001
      - PRODUCT_SERVICE_URL=http://localhost:5002
      - ORDER_SERVICE_URL=http://localhost:5003
    depends_on:
      - user-service
      - product-service
      - order-service
    networks:
      - ecommerce-net
    restart: unless-stopped

volumes:
  mongo_data:

networks:
  ecommerce-net:
    driver: bridge
