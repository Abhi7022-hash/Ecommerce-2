apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ecommerce
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Abhi7022-hash/Ecommerce-2.git
    targetRevision: main
    path: ecommerce-helm
    helm:
      valueFiles:
        - values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: ecommerce-2

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
