apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.user.deploymentname }}
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.user.replicaCount }}
  strategy:
    type: {{ .Values.strategy.type }}
    rollingUpdate:
      maxUnavailable: {{ .Values.strategy.maxUnavailable }}
      maxSurge: {{ .Values/strategy.maxSurge }}

  selector:
    matchLabels:
      app:  {{ .Values.user.deploymentname }}

  template:
    metadata:
      labels:
        app:  {{ .Values.user.deploymentname }}

    spec:
      containers:
        - name: user-service

          image: "{{ .Values.user.image.repository }}:{{ .Values.user.image.tag }}"

          ports:
            - containerPort: {{ .Values.user.port }}

          env:
            - name: MONGO_URI
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: MONGO_URI

            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secret
                  key: SECRET_KEY