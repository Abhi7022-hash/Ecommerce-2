apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.mongo.pvcname }}
  namespace: {{ .Values.namespace }}
spec:
  accessModes:
    - ReadWriteOnce

  storageClassName: {{ .Values.mongo.storage.storageClass }}

  resources:
    requests:
      storage: {{ .Values.mongo.storage.size }}