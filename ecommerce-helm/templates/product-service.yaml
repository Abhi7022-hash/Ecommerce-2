apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.product.servicename }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}

  selector:
    app:  {{ .Values.product.deploymentname }}

  ports:
    - port: {{ .Values.product.port }}
      targetPort: {{ .Values.product.port }}