apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.product.deploymentname }}
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.product.replicaCount }}

  selector:
    matchLabels:
      app:  {{ .Values.product.deploymentname }}

  template:
    metadata:
      labels:
        app:  {{ .Values.product.deploymentname }}

    spec:
      containers:
        - name: product-service

          image: "{{ .Values.product.image.repository }}:{{ .Values.product.image.tag }}"

          ports:
            - containerPort: {{ .Values.product.port }}

          env:
            - name: MONGO_URI
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: MONGO_URI