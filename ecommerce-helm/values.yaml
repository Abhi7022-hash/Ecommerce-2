namespace: ecommerce-2

frontend:
  deployment-name: frontend-service #User for labels
  service-name: frontend-service
  replicaCount: 1
  image:
    repository: abhishek661/frontend
    tag: v1
  port: 5000

user:
  deployment-name: user-service #user for labels
  service-name: user-service
  replicaCount: 1
  image:
    repository: abhishek661/user
    tag: v1
  port: 5001

product:
  deployment-name: product-service #user for labels 
  service-name: product-service
  replicaCount: 1
  image:
    repository: abhishek661/product
    tag: v1
  port: 5002

order:
  deployment-name: order-service # user for labels
  service-name: 
  replicaCount: 1
  image:
    repository: abhishek661/order
    tag: v1
  port: 5003

mongo:
  deployment-name: mongo # user for labels
  service-name: mongo-service
  pvc-name: mongo
  replicaCount: 1
  image:
    repository: mongo
    tag: "7"
  port: 27017

  storage:
    size: 1Gi
    storageClass: gp2

config:
  config-name: ecommerce-config
  mongoUri: "mongodb://mongo-service:27017/"

  frontend:
    userServiceUrl: "/api/users"
    productServiceUrl: "/api/products"
    orderServiceUrl: "/api/orders"

  order:
    userServiceUrl: "http://user-service:5001"
    productServiceUrl: "http://product-service:5002"

secret:
  secret-name: ecommerce-secret
  secretKey: "ecommerce-super-secret"

service:
  type: NodePort

ingress:
  name: ecommerce-ingress
  enabled: true
  ingressClassName: alb
  scheme: internet-facing
  targetType: instance