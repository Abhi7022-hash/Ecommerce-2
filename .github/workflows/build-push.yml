
name: Build and Push Images to DockerHub

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    env:
      IMAGE_TAG: v${{ github.run_number }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Frontend
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/frontend:${{ env.IMAGE_TAG }} ./frontend-service
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/frontend:${{ env.IMAGE_TAG }}

      - name: Build and Push User Service
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/user:${{ env.IMAGE_TAG }} ./user-service
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/user:${{ env.IMAGE_TAG }}

      - name: Build and Push Product Service
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/product:${{ env.IMAGE_TAG }} ./product-service
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/product:${{ env.IMAGE_TAG }}

      - name: Build and Push Order Service
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/order:${{ env.IMAGE_TAG }} ./order-service
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/order:${{ env.IMAGE_TAG }}
