name: Build and Push E-commerce Images

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "user/**"
      - "product/**"
      - "order/**"
      - ".github/workflows/build-push.yml"

  workflow_dispatch:

permissions:
  contents: read

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  IMAGE_TAG: v${{ github.run_number }}

jobs:
  build-and-push:
    name: Build and Push Changed Services
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Detect changed service folders
      - name: Detect Changed Services
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
            user:
              - 'user/**'
            product:
              - 'product/**'
            order:
              - 'order/**'

      # 3. Login to Docker Hub
      - name: Login to Docker Hub
        if: |
          steps.filter.outputs.frontend == 'true' ||
          steps.filter.outputs.user == 'true' ||
          steps.filter.outputs.product == 'true' ||
          steps.filter.outputs.order == 'true' ||
          github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Set up Docker Buildx
      - name: Set up Docker Buildx
        if: |
          steps.filter.outputs.frontend == 'true' ||
          steps.filter.outputs.user == 'true' ||
          steps.filter.outputs.product == 'true' ||
          steps.filter.outputs.order == 'true' ||
          github.event_name == 'workflow_dispatch'
        uses: docker/setup-buildx-action@v3

      # 5. Build and push frontend image
      - name: Build and Push Frontend
        if: steps.filter.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ env.DOCKERHUB_USERNAME }}/frontend:${{ env.IMAGE_TAG }}

      # 6. Build and push user image
      - name: Build and Push User
        if: steps.filter.outputs.user == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: ./user
          push: true
          tags: ${{ env.DOCKERHUB_USERNAME }}/user:${{ env.IMAGE_TAG }}

      # 7. Build and push product image
      - name: Build and Push Product
        if: steps.filter.outputs.product == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: ./product
          push: true
          tags: ${{ env.DOCKERHUB_USERNAME }}/product:${{ env.IMAGE_TAG }}

      # 8. Build and push order image
      - name: Build and Push Order
        if: steps.filter.outputs.order == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: ./order
          push: true
          tags: ${{ env.DOCKERHUB_USERNAME }}/order:${{ env.IMAGE_TAG }}
