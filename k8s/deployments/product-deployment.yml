apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: ecommerce-2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      containers:
        - name: product-service
          image: abhishek661/product-service:v3
          ports:
            - containerPort: 5002
          env:
            - name: MONGO_URI
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: MONGO_URI
